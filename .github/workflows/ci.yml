name: CI
on:
  push:
  workflow_dispatch:
jobs:
  engine-tests:
    name: Engine tests (Swift on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run engine checks
        run: sh test-engine.sh
      - name: v5 transcripts for comparison
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh Tests/v5/run.sh
  ios-build:
    name: iOS build (Xcode, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
      - name: Build for generic iOS device
        run: |
          set +e
          xcodebuild -project StreamLab.xcodeproj -scheme StreamLab -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO OTHER_SWIFT_FLAGS='-Xfrontend -warn-long-expression-type-checking=400' \
            build > build.log 2>&1
          status=$?
          grep -E "error:|warning: .*(type-check|deprecated)|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -80
          tail -5 build.log
          exit $status
      - name: Engine checks with Apple toolchain
        run: |
          set -o pipefail
          sh test-engine.sh | grep -E "FAIL|Final|Offline hour|Host reply"
